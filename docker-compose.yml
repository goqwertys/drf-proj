version: '3.9'

services:
  web:
    container_name: app
    build: .
    command: sh -c sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - -db -redis
    env_file:
      - .env

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/ect/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

  db:
    container_name: db
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"

  redis:
    container_name: redis
    image: redis:6
    volumes:
      - redis_data:/data
    env_file:
      - ./.env

  celery:
    container_name: celery
    build: .
    command: >
      bash -c "celery -A config.celery  worker --loglevel=INFO -B"
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery_beat:
    container_name: celery_beat
    build: .
    env_file:
      - .env
    command: >
      bash -c "celery -A config beat --loglevel=info"
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
  static_volume:
  redis_data:
